[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automac"
version = "0.1.0"
description = "校園網 MAC 限速偵測與自動切換（含區網防重疊）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["psutil>=5.9", "zeroconf>=0.130"]

[project.scripts]
automac = "automac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
